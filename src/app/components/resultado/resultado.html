<div
  role="status"
  style="background-color: #e8f5e9; border: 1px solid #4caf50; padding: 16px; border-radius: 8px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px;"
>
  <mat-icon
    aria-hidden="true"
    style="color: #2e7d32; font-size: 28px; width: 28px; height: 28px;"
  >
    check_circle
  </mat-icon>

  <div>
    <strong style="color: #1b5e20; display: block;">
      Demonstração concluída
    </strong>
    <span style="font-size: 12px; color: #2e7d32;">
      A pesagem não é gravada nem sincronizada.
    </span>
  </div>
</div>

<mat-card style="padding: 16px; margin-bottom: 20px;">
  <h3 style="margin: 0 0 8px;">
    Histórico de exemplo
  </h3>

  <p style="margin: 0 0 12px;">
    Os registros abaixo são fictícios e não foram gerados pelo formulário.
    Esta demonstração não armazena informações.
  </p>

  <div
    *ngFor="let item of historico"
    style="border-bottom: 1px solid #eee; padding: 8px 0;"
  >
    <strong>{{ item.data }}</strong> — {{ item.peso }} | {{ item.altura }}
  </div>
</mat-card>

<button
  mat-raised-button
  color="primary"
  style="width: 100%; height: 48px;"
  (click)="voltar()"
>
  Voltar à busca
</button>

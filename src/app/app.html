<div class="app-shell" [style.zoom]="zoomLevel">
  <mat-toolbar color="primary" class="app-toolbar">
    <span class="brand">Pastoral da Criança</span>

    <div class="toolbar-actions">
      <div
        class="accessibility-controls"
        role="group"
        aria-label="Controles de ampliação da interface"
      >
        <span class="control-label">Acessibilidade</span>

        <button
          mat-button
          type="button"
          class="zoom-button"
          aria-label="Diminuir ampliação da interface"
          title="Diminuir ampliação"
          (click)="diminuirAmpliacao()"
        >
          A−
        </button>

        <span
          class="zoom-value"
          aria-live="polite"
          aria-atomic="true"
          aria-label="Nível de ampliação"
        >
          {{ zoomPercent }}%
        </span>

        <button
          mat-button
          type="button"
          class="zoom-button"
          aria-label="Ampliar a interface"
          title="Ampliar interface"
          (click)="ampliarInterface()"
        >
          A+
        </button>

        <button
          mat-button
          type="button"
          class="reset-button"
          aria-label="Restaurar ampliação padrão"
          title="Restaurar tamanho padrão"
          (click)="restaurarAmpliacao()"
        >
          Padrão
        </button>
      </div>

      <span class="online-status">
        <mat-icon aria-hidden="true">wifi</mat-icon>
        Online
      </span>
    </div>
  </mat-toolbar>

  <main class="app-content" aria-label="Conteúdo principal">
    <router-outlet></router-outlet>
  </main>
</div>
